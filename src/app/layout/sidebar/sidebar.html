<aside class="flex w-64 shrink-0 flex-col border-r bg-white" style="border-color: var(--lf-border)">
  <div class="flex h-16 items-center px-6">
    <span class="text-xl font-semibold">
      LedgerFlow
    </span>
  </div>

  <nav class="flex-1 space-y-1 px-3 py-4">

    @for (item of navItems; track item.route) {
    <a [routerLink]="item.route" routerLinkActive="bg-blue-50 text-blue-700" [routerLinkActiveOptions]="{ exact: true }"
      class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-slate-600 transition-colors hover:bg-slate-50">
      <mat-icon class="text-[20px]">
        {{ item.icon }}
      </mat-icon>

      <span>
        {{ item.label }}
      </span>
    </a>
    }

  </nav>

  <div class="border-t p-3" style="border-color: var(--lf-border)">
    <a routerLink="/settings" routerLinkActive="bg-blue-50 text-blue-700" [routerLinkActiveOptions]="{ exact: true }"
      class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-slate-600 transition-colors hover:bg-slate-50">
      <mat-icon class="text-[20px]">
        settings
      </mat-icon>

      <span>Settings</span>
    </a>
  </div>
</aside>
